services:
  postgres:
    image: postgres:16-alpine
    container_name: finsim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsim}
      POSTGRES_USER: ${POSTGRES_USER:-finsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsim}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsim} -d ${POSTGRES_DB:-finsim}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
